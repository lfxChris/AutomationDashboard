name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      # `npm install` (not `npm ci`) so the build tolerates platform-
      # specific optional deps that get pruned from the lock file when
      # contributors run npm on Windows vs Linux.
      - run: npm install --no-audit --no-fund

      - name: Build
        env:
          # Repo subpath that GitHub Pages serves from. Set as a repo variable
          # named VITE_BASE (e.g. "/AutomationDashboard/") in repo settings.
          VITE_BASE: ${{ vars.VITE_BASE }}
          # Public URL of the deployed FastAPI backend on Render.
          # Set as a repo variable named VITE_API_URL (e.g. https://your-app.onrender.com).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-vue/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
